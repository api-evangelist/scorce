name: Scorce
description: Scorce is a Mexico-based API aggregation platform that gives businesses a single
  integration point to connect to multiple Latin American and global identity APIs for customer
  authentication, KYC (Know Your Customer), digital identity verification, and fraud prevention.
  The platform lets teams connect in under 24 hours, obtain provider trials, and monitor API
  performance across providers from one unified dashboard. Founded in 2019 and headquartered
  in Puebla, Mexico, Scorce is backed by 500 Global, Finnovista, and Tenity.
